<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firealerts</title>
  <meta name="description" content="Satellite fire detection, fire danger forecasting and probabilistic spread prediction." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔥</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2c1 3.5-1.6 5.3-1.6 8.2 0 1.4.9 2.5 2.1 2.5 1.6 0 2.3-1.5 2.1-3.4 2.3 1.8 3.9 4.4 3.9 7.2A6.5 6.5 0 0 1 12 23a6.5 6.5 0 0 1-6.5-6.5c0-4.6 3.6-6.9 4.6-10.2.4 1.2.3 2.6-.1 3.6C11.5 8.2 13 5.6 12 2z"/></svg>
      </span>
      <span class="name">Firealerts</span>
      <span id="mode-pill" class="pill">…</span>
    </div>
    <div class="stats" id="sensor-stats"></div>
    <div class="controls">
      <label class="ctl">Window
        <select id="window">
          <option value="6">6 h</option>
          <option value="12">12 h</option>
          <option value="24" selected>24 h</option>
          <option value="48">48 h</option>
        </select>
      </label>
      <div class="seg" id="basemap">
        <button data-v="dark" class="on">Dark</button>
        <button data-v="sat">Satellite</button>
      </div>
      <button id="refresh" class="icon-btn" title="Fetch new satellite data now">↻</button>
      <div class="account" id="account"></div>
    </div>
  </header>

  <aside class="panel" id="panel">
    <nav class="tabs">
      <button data-tab="incidents" class="on">Incidents</button>
      <button data-tab="danger">Danger forecast</button>
      <button data-tab="alerts">Alerts</button>
    </nav>

    <section class="tab on" id="tab-incidents">
      <div class="toolbar">
        <input id="inc-filter" type="search" placeholder="Filter by sensor or coordinates" />
        <label class="ctl small">Min. pixels <input id="min-count" type="number" min="1" value="3" /></label>
      </div>
      <label class="check" title="Volcanoes, gas flares and hotspots seen on most days"><input type="checkbox" id="hide-static" checked /> Hide static sources</label>
      <div id="inc-summary" class="muted small"></div>
      <ol id="incident-list" class="list"></ol>
    </section>

    <section class="tab" id="tab-danger">
      <div class="seg wide" id="risk-kind">
        <button data-v="fwi" class="on">Fire danger (FWI)</button>
        <button data-v="ignition">Ignition probability</button>
      </div>
      <p class="muted small" id="risk-help">Canadian Fire Weather Index computed from 45 days of observed weather plus a 7-day forecast. Click anywhere on the map for a point outlook.</p>
      <button id="danger-load" class="btn primary">Show for current view</button>
      <div id="danger-controls" hidden>
        <label class="ctl">Day <input type="range" id="danger-day" min="0" max="7" value="1" /></label>
        <div id="danger-date" class="mono"></div>
        <div class="legend" id="danger-legend"></div>
        <div class="note" id="model-info" hidden></div>
        <label class="check"><input type="checkbox" id="danger-visible" checked /> Show layer</label>
      </div>
      <div id="point-danger"></div>
    </section>

    <section class="tab" id="tab-alerts">
      <form id="aoi-form" class="card">
        <h3>Watch an area</h3>
        <label>Name <input name="name" required placeholder="e.g. Ranch north block" /></label>
        <div class="row">
          <label>Radius km <input name="radius_km" type="number" step="0.1" min="0.1" value="10" required /></label>
          <label>Extra buffer km <input name="buffer_km" type="number" step="0.1" min="0" value="0" /></label>
        </div>
        <div class="row">
          <label>Centre <input name="center" placeholder="lat, lon" required /></label>
          <button type="button" id="pick-center" class="btn">Pick on map</button>
        </div>
        <label>Min. confidence
          <select name="min_confidence"><option value="l">Low</option><option value="n" selected>Nominal</option><option value="h">High</option></select>
        </label>
        <label class="check"><input type="checkbox" name="include_static" /> Also alert on volcanoes, gas flares &amp; persistent hotspots</label>
        <label>E-mail <input name="email" type="email" placeholder="optional" /></label>
        <label>Webhook URL <input name="webhook_url" type="url" placeholder="optional (Slack, Teams, custom)" /></label>
        <label>Telegram chat id <input name="telegram_chat_id" placeholder="optional" /></label>
        <button class="btn primary" type="submit">Create alert area</button>
      </form>
      <h3>Areas</h3>
      <ul id="aoi-list" class="list"></ul>
      <h3>Recent alerts</h3>
      <ul id="alert-list" class="list"></ul>
    </section>
  </aside>

  <main id="map"></main>

  <div class="map-tools">
    <button id="whatif" class="btn" title="Click the map to simulate an ignition">✦ What-if ignition</button>
    <div class="legend floating" id="det-legend">
      <div class="legend-title">Detection age</div>
      <span><i style="background:var(--age0)"></i>&lt;1 h</span>
      <span><i style="background:var(--age1)"></i>1–6 h</span>
      <span><i style="background:var(--age2)"></i>6–12 h</span>
      <span><i style="background:var(--age3)"></i>&gt;12 h</span>
    </div>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <button class="close" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

# Production-style stack: PostgreSQL + API + background worker + web frontend.
#   cp .env.example .env   # set SECRET_KEY, APP_URL, credentials ...
#   docker compose up --build -d      -> http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firealerts
      POSTGRES_USER: firealerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firealerts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firealerts -d firealerts"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://firealerts:${POSTGRES_PASSWORD:-firealerts}@db:5432/firealerts
      SCHEDULER_ENABLED: "false"
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      PUBLIC_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "firealerts.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://firealerts:${POSTGRES_PASSWORD:-firealerts}@db:5432/firealerts
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
